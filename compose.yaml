# Production stack of ronron, the home server (Debian, x86_64).
#
# The images of the apps (vps-back, site, next-site, atkuzu) are built on
# ronron, from the sources in src/ and the Dockerfiles in images/ (`just ship`).
# All the other images come from their upstream registry. Test this stack
# locally with `just local-up`, which adds compose.local.yaml on top of this
# file.
#
# Not in git: env/*.env (secrets, see env/*.env.example), data/ (the data of
# the services) and src/ (the sources of the apps, cloned by scripts/sources.sh).
#
# Addresses: 10.10.0.4 is ronron on WireGuard (wg0). The Caddy of the Hetzner
# VPS reaches Immich and Forgejo there. Docker starts after wg-quick@wg0 (see
# host/systemd/docker.service.d/after-wg.conf), so the containers can bind
# 10.10.0.4.

name: ronron

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  # Immich: the photos. Hardware transcoding (Quick Sync) and machine learning
  # (OpenVINO) on the Intel iGPU.
  immich-server:
    image: ghcr.io/immich-app/immich-server:v3.3.5
    env_file: env/immich.env
    # These values win over the env file.
    environment:
      DB_HOSTNAME: immich-postgres
      DB_USERNAME: postgres
      DB_DATABASE_NAME: immich
      REDIS_HOSTNAME: immich-redis
    devices:
      - /dev/dri:/dev/dri
    ports:
      # LAN and WireGuard. IPv4 only: Docker bypasses ufw, and a bare port
      # would also bind on IPv6.
      - 0.0.0.0:2283:2283
    volumes:
      - ./data/immich/library:/data
      - /etc/localtime:/etc/localtime:ro
    networks: [immich]
    depends_on:
      - immich-redis
      - immich-postgres
    restart: unless-stopped
    logging: *logging

  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:v3.3.5-openvino
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - immich-model-cache:/cache
    networks: [immich]
    restart: unless-stopped
    logging: *logging

  immich-redis:
    image: docker.io/valkey/valkey:9@sha256:c123e3715db63d06d4ad6964884037aa0d5d4d703939b9929954112889708e1d
    healthcheck:
      test: redis-cli ping | grep -q PONG || exit 1
    networks: [immich]
    restart: unless-stopped
    logging: *logging

  # The Postgres of Immich, with the vector extensions that Immich needs.
  immich-postgres:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    # POSTGRES_PASSWORD: used only to create a new database.
    env_file: env/immich.env
    environment:
      # The health check of the image uses them.
      POSTGRES_USER: postgres
      POSTGRES_DB: immich
      POSTGRES_INITDB_ARGS: --data-checksums
    volumes:
      - ./data/immich/postgres:/var/lib/postgresql/data
    shm_size: 128mb
    networks: [immich]
    restart: unless-stopped
    logging: *logging

  # Paperless-ngx: the documents. Its database is SQLite, in data/paperless/data.
  paperless:
    image: ghcr.io/paperless-ngx/paperless-ngx:3.0.5
    env_file: env/paperless.env
    environment:
      PAPERLESS_REDIS: redis://paperless-redis:6379
    ports:
      # WireGuard only: not reachable from the LAN or the internet.
      - 10.10.0.4:8000:8000
    volumes:
      - ./data/paperless/data:/usr/src/paperless/data
      - ./data/paperless/media:/usr/src/paperless/media
      - ./data/paperless/export:/usr/src/paperless/export
      - ./data/paperless/consume:/usr/src/paperless/consume
    networks: [paperless]
    depends_on:
      - paperless-redis
    restart: unless-stopped
    logging: *logging

  paperless-redis:
    image: docker.io/library/redis:8.10.2
    volumes:
      - paperless-redis:/data
    healthcheck:
      test: redis-cli ping | grep -q PONG || exit 1
    networks: [paperless]
    restart: unless-stopped
    logging: *logging

  # Forgejo: the git server. The theme and templates of forgejo/custom/ (the git
  # submodule forgejo, repository tom/forgejo) go over the data volume, through
  # the custom/ mechanism of Forgejo: no image build.
  forgejo:
    image: codeberg.org/forgejo/forgejo:16.0.4
    environment:
      USER_UID: 1000
      USER_GID: 1000

      FORGEJO__database__DB_TYPE: sqlite3

      # Forgejo Actions: a `uses:` without a full URL (actions/checkout@v4,
      # for example) comes from GitHub, as on GitHub. The default,
      # data.forgejo.org, does not have dtolnay/rust-toolchain or
      # Swatinem/rust-cache.
      FORGEJO__actions__DEFAULT_ACTIONS_URL: https://github.com

      # The default MIGRATE timeout (600 s) is too short for large repositories
      # (zed, typst-packages, for example): they are cloned partway, then
      # deleted. MIRROR covers the periodic resync of the same repositories.
      FORGEJO__git.timeout__MIGRATE: "3600"
      FORGEJO__git.timeout__MIRROR: "3600"
      FORGEJO__git.timeout__CLONE: "3600"
      FORGEJO__git.timeout__PULL: "3600"

      FORGEJO__other__SHOW_FOOTER_POWERED_BY: "false"
      FORGEJO__other__SHOW_FOOTER_TEMPLATE_LOAD_TIME: "true"
      FORGEJO__other__SHOW_FOOTER_VERSION: "true"

      FORGEJO__security__INSTALL_LOCK: "true"
      FORGEJO__security__REVERSE_PROXY_TRUSTED_PROXIES: 172.16.0.0/12,10.10.0.0/24,127.0.0.0/8

      FORGEJO__server__DOMAIN: git.tomplanche.com
      FORGEJO__server__ROOT_URL: https://git.tomplanche.com/
      FORGEJO__server__SSH_DOMAIN: git.tomplanche.com
      # The VPS forwards its port 2223 to port 2222 of ronron.
      FORGEJO__server__SSH_PORT: 2223

      FORGEJO__service__DISABLE_REGISTRATION: "true"

      FORGEJO__ui__DEFAULT_THEME: tomplanche
      FORGEJO__ui__THEMES: forgejo-auto,forgejo-light,forgejo-dark,tomplanche

      TZ: Europe/Paris
    volumes:
      - ./data/forgejo:/data
      - ./forgejo/custom/templates:/data/gitea/templates:ro
      # With the fonts of the theme in custom/public/assets/fonts: the
      # repository forgejo ignores them (license), so copy them there.
      - ./forgejo/custom/public:/data/gitea/public:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      # LAN and WireGuard. IPv4 only: Docker bypasses ufw, and a bare port
      # would also bind on IPv6.
      - 0.0.0.0:3000:3000
      - 0.0.0.0:2222:22
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:3000/api/healthz"]
      interval: 60s
      timeout: 5s
      start_period: 30s
    networks:
      forgejo: {}
      forgejo-runner:
        # A fixed address: the jobs clone the repositories from
        # http://forgejo:3000, the URL of the runner, and the name forgejo
        # does not resolve in forgejo-runner-dind. container.options of
        # forgejo-runner/config.yml gives them this address.
        ipv4_address: 172.30.250.2
    restart: unless-stopped
    logging: *logging

  # The runner of Forgejo Actions: it runs the jobs of the workflows (CI). Its
  # config is forgejo-runner/config.yml, its token data/forgejo-runner/token
  # (`just runner-register`). It asks Forgejo for jobs on the network
  # forgejo-runner, and it starts each job in a container of
  # forgejo-runner-dind, not of the Docker of ronron: a job cannot see the
  # other containers or their data.
  forgejo-runner:
    image: data.forgejo.org/forgejo/runner:13.2.1
    command: ["forgejo-runner", "daemon", "--config", "/etc/forgejo-runner/config.yml"]
    # The image runs as uid 1000: the owner of data/forgejo-runner. The group
    # 1000 can use the Docker socket of forgejo-runner-dind (--group 1000).
    environment:
      DOCKER_HOST: unix:///run/dind/docker.sock
    volumes:
      # The token and the cache of the actions (actions/cache, rust-cache).
      - ./data/forgejo-runner:/data
      - ./forgejo-runner/config.yml:/etc/forgejo-runner/config.yml:ro
      - forgejo-runner-socket:/run/dind
    depends_on:
      forgejo:
        condition: service_started
      forgejo-runner-dind:
        condition: service_healthy
    networks:
      forgejo-runner:
        # A fixed address: the jobs reach the cache of the runner there
        # (cache.host in forgejo-runner/config.yml).
        ipv4_address: 172.30.250.10
    restart: unless-stopped
    logging: *logging

  # A Docker daemon for the jobs only (Docker-in-Docker). Privileged: Docker
  # needs it to start containers. It listens only on a socket in the volume
  # forgejo-runner-socket, which only forgejo-runner mounts: the jobs cannot
  # reach it over the network. The limits apply to all the jobs together.
  forgejo-runner-dind:
    image: docker:29.9.2-dind
    privileged: true
    command: ["dockerd", "--host=unix:///run/dind/docker.sock", "--group=1000"]
    environment:
      # No TLS certificates: there is no TCP port.
      DOCKER_TLS_CERTDIR: ""
    volumes:
      - forgejo-runner-socket:/run/dind
      # The images of the jobs (node:24-trixie, for example), kept between
      # restarts.
      - forgejo-runner-docker:/var/lib/docker
    cpus: 8
    mem_limit: 12g
    healthcheck:
      test: ["CMD", "docker", "--host=unix:///run/dind/docker.sock", "info"]
      interval: 60s
      timeout: 10s
      start_period: 30s
      start_interval: 2s
    networks: [forgejo-runner]
    restart: unless-stopped
    logging: *logging

  # Beszel agent: it gives the CPU, RAM, disks, network, temperatures, GPU and
  # containers of ronron to the Beszel hub of the Hetzner VPS. The hub connects
  # to the agent over WireGuard, with SSH (10.10.0.1 to 10.10.0.4:45876). The
  # agent accepts only the key of the hub (KEY). In the hub, the system
  # "ronron" has the host 10.10.0.4 and the port 45876.
  beszel-agent:
    # The same version as the hub. The Intel variant contains intel_gpu_top,
    # which reads the iGPU (i915 driver).
    image: henrygd/beszel-agent-intel:0.21.1
    # Host network: the agent reads the network of the host, and it listens on
    # the WireGuard address of ronron.
    network_mode: host
    # intel_gpu_top reads the GPU through perf events, which need CAP_PERFMON.
    # Debian sets kernel.perf_event_paranoid=3, which blocks them even with
    # CAP_PERFMON: ronron needs 2 (/etc/sysctl.d/99-intel-gpu-beszel.conf).
    cap_add:
      - CAP_PERFMON
    devices:
      - /dev/dri/card0:/dev/dri/card0
    environment:
      # wg0 only: the LAN cannot reach the agent.
      LISTEN: 10.10.0.4:45876
      # The public key of the hub. It is not a secret.
      KEY: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDbM7AfwkiQpWFPNfDu/xfcs+9c8WFJ05HW3XWsTsqdt"
    volumes:
      - ./data/beszel-agent:/var/lib/beszel-agent
      # Read only, but the Docker socket still gives wide access to the host.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # The backup disk (Samsung T5, sdb1 on /srv/backup). The agent reads the
      # usage of the filesystem of this empty folder, which Docker creates.
      - /srv/backup/.beszel:/extra-filesystems/sdb1__Backup:ro
    healthcheck:
      test: ["CMD", "/agent", "health"]
      interval: 60s
      timeout: 5s
      start_period: 10s
    restart: unless-stopped
    logging: *logging

  # VictoriaMetrics: the store of the metrics, in the Prometheus format. The
  # vmagent of the Hetzner VPS sends its metrics here over WireGuard, and
  # Grafana reads them. It also keeps its own metrics (-selfScrapeInterval).
  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.154.0
    command:
      - -storageDataPath=/storage
      - -retentionPeriod=1y
      - -selfScrapeInterval=30s
    ports:
      # WireGuard only: the vmagent of the VPS writes here. There is no
      # password, so each WireGuard peer can read and write the metrics.
      - 10.10.0.4:8428:8428
    volumes:
      - ./data/victoriametrics:/storage
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8428/health"]
      interval: 60s
      timeout: 5s
      start_period: 10s
    networks: [monitoring]
    restart: unless-stopped
    logging: *logging

  # Grafana: the dashboards of the metrics. The data source and the dashboards
  # come from grafana/ (provisioning). The users and the dashboards made in the
  # UI are in data/grafana.
  grafana:
    image: grafana/grafana:13.2.4
    # The owner of data/grafana: make the folder before the first start, else
    # Docker makes it for root and Grafana cannot write to it.
    user: "1000:1000"
    env_file: env/grafana.env
    environment:
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      # WireGuard only. Port 3000 is Forgejo.
      - 10.10.0.4:3030:3000
    volumes:
      - ./data/grafana:/var/lib/grafana
      # Only these 2 folders: the image keeps its other (empty) folders of
      # provisioning, which Grafana reads at start-up.
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 60s
      timeout: 5s
      start_period: 30s
    depends_on:
      - victoriametrics
    networks: [monitoring]
    restart: unless-stopped
    logging: *logging

  # The apps behind the public sites. The Caddy of the Hetzner VPS sends their
  # names to these ports over WireGuard: api.tomplanche.com and
  # tomplanche.com/api/* to vps-back, tomplanche.com to site,
  # next.tomplanche.com to next-site, atkuzu.tomplanche.com to atkuzu. The ports
  # listen on WireGuard only. Ports 3000 (Forgejo) and 8000 (Paperless) are
  # taken, hence 3100-3102 and 8100.

  # vps-back: the API (Rust, axum). It serves data/vps-back/static under
  # /static/.
  vps-back:
    image: tomplanche/vps-back:main
    build:
      context: src/vps-back
      dockerfile: ../../images/vps-back/Dockerfile
    ports:
      - 10.10.0.4:8100:8000
    env_file: env/vps-back.env
    # These values win over the env file.
    environment:
      HOST: 0.0.0.0
      PORT: "8000"
      STATIC_DIR: /data/static
    volumes:
      # Served under /static/ (api.tomplanche.com/static/). Writable: vps-back
      # writes github-stats.json in it.
      - ./data/vps-back/static:/data/static
    networks: [vps-back]
    restart: unless-stopped
    logging: *logging

  # site and next-site: the portfolio front (SvelteKit), on the main and next
  # branches of the same repository.
  site:
    image: tomplanche/portfolio:main
    build:
      context: src/site
      dockerfile: ../../images/portfolio/Dockerfile
      args:
        COMMIT_SHA: ${SITE_COMMIT_SHA:-}
        COMMIT_DATE: ${SITE_COMMIT_DATE:-}
        COMMIT_URL: ${SITE_COMMIT_URL:-}
    ports:
      - 10.10.0.4:3100:3000
    env_file: env/site.env
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
    volumes:
      # The fonts of the site: their license keeps them out of the image.
      - ./data/fonts:/app/build/client/fonts:ro
    networks: [portfolio]
    restart: unless-stopped
    logging: *logging

  next-site:
    image: tomplanche/portfolio:next
    build:
      context: src/next-site
      dockerfile: ../../images/portfolio/Dockerfile
      args:
        COMMIT_SHA: ${NEXT_COMMIT_SHA:-}
        COMMIT_DATE: ${NEXT_COMMIT_DATE:-}
        COMMIT_URL: ${NEXT_COMMIT_URL:-}
    ports:
      - 10.10.0.4:3101:3000
    # The env of site, then the values that differ for next-site (MAINTENANCE,
    # for example). A later file wins over an earlier one.
    env_file:
      - env/site.env
      - path: env/next-site.env
        required: false
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
    volumes:
      - ./data/fonts:/app/build/client/fonts:ro
    networks: [portfolio]
    restart: unless-stopped
    logging: *logging

  # atkuzu: the Takuzu game (SvelteKit, SQLite, atproto OAuth).
  atkuzu:
    image: tomplanche/atkuzu:main
    build:
      context: src/atkuzu
      dockerfile: ../../images/atkuzu/Dockerfile
      target: app
    ports:
      - 10.10.0.4:3102:3000
    env_file: env/atkuzu.env
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      DATABASE_URL: /data/atkuzu.db
      # The dailies that atkuzu-daily writes: the app serves them from here.
      DAILY_DIR: /data/daily
      # Behind the Caddy of the VPS: the public URL of a request (for the OAuth
      # login and the check of form origins) comes from its X-Forwarded-*
      # headers.
      PROTOCOL_HEADER: x-forwarded-proto
      HOST_HEADER: x-forwarded-host
    volumes:
      # The SQLite database (the OAuth sessions and state) and daily/.
      - ./data/atkuzu:/data
    networks: [atkuzu]
    restart: unless-stopped
    logging: *logging

  # A one-shot job, not a server: `just publish-daily` (or
  # `docker compose run --rm atkuzu-daily`) writes the missing dailies of
  # atkuzu into data/atkuzu/daily, which the app serves. Cron runs it every
  # hour (see the README).
  atkuzu-daily:
    image: tomplanche/atkuzu-daily:main
    build:
      context: src/atkuzu
      dockerfile: ../../images/atkuzu/Dockerfile
      target: daily
    profiles: [tools]
    env_file: env/atkuzu-daily.env
    volumes:
      - ./data/atkuzu/daily:/app/static/daily
    networks: [atkuzu]
    logging: *logging

networks:
  # One network per app: the containers of an app cannot reach the others.
  immich:
  paperless:
  forgejo:
  monitoring:
  vps-back:
  portfolio:
  atkuzu:
  # Forgejo, forgejo-runner and forgejo-runner-dind. A fixed subnet, for the
  # fixed addresses of forgejo and forgejo-runner. Docker gives the other
  # addresses from ip_range only, so it cannot give a fixed address to another
  # container (forgejo-runner-dind before forgejo, for example, after a reboot).
  forgejo-runner:
    ipam:
      config:
        - subnet: 172.30.250.0/24
          ip_range: 172.30.250.128/25
          # Else Docker takes the first address of ip_range.
          gateway: 172.30.250.1

volumes:
  # A cache: Immich downloads the models again when it is empty.
  immich-model-cache:
  # The task queue of Paperless.
  paperless-redis:
  # The Docker socket of forgejo-runner-dind, for forgejo-runner.
  forgejo-runner-socket:
  # The images and containers of the jobs. A cache: Docker downloads the
  # images again when it is empty.
  forgejo-runner-docker:
