# The changes of compose.yaml for a local test on the Mac: `just local-up`.
#
# - The env files are env/*.env.example, with test values.
# - The images of the apps have the architecture of the Mac (`just build`).
# - The ports listen on 127.0.0.1, with no WireGuard address. Paperless is on
#   port 8010 and Forgejo on port 3010, so that the local test of hetzner-docker
#   (ports 8000 and 3000) can run at the same time.
# - No Intel GPU: Immich transcodes on the CPU.
# - immich-machine-learning (a large image) and beszel-agent (it needs the hub)
#   do not start.

services:
  immich-server:
    env_file: !override
      - env/immich.env.example
    devices: !reset []
    ports: !override
      - 127.0.0.1:2283:2283

  immich-postgres:
    env_file: !override
      - env/immich.env.example
    # A volume, not a folder of the Mac: Postgres needs the owners and
    # permissions of a Linux filesystem.
    volumes: !override
      - immich-postgres-local:/var/lib/postgresql/data

  paperless:
    env_file: !override
      - env/paperless.env.example
    ports: !override
      - 127.0.0.1:8010:8000

  forgejo:
    environment:
      FORGEJO__server__DOMAIN: localhost
      FORGEJO__server__ROOT_URL: http://localhost:3010/
      FORGEJO__server__SSH_DOMAIN: localhost
      FORGEJO__server__SSH_PORT: 2232
    ports: !override
      - 127.0.0.1:3010:3000
      - 127.0.0.1:2232:22

  victoriametrics:
    ports: !override
      - 127.0.0.1:8428:8428

  # Port 3031: `just grafana-tunnel` uses 3030 for the Grafana of ronron.
  grafana:
    env_file: !override
      - env/grafana.env.example
    ports: !override
      - 127.0.0.1:3031:3000

  # The apps: the same ports as in production, on 127.0.0.1.
  vps-back:
    env_file: !override
      - env/vps-back.env.example
    ports: !override
      - 127.0.0.1:8100:8000

  site:
    env_file: !override
      - env/site.env.example
    ports: !override
      - 127.0.0.1:3100:3000

  next-site:
    env_file: !override
      - env/site.env.example
      - env/next-site.env.example
    ports: !override
      - 127.0.0.1:3101:3000

  atkuzu:
    env_file: !override
      - env/atkuzu.env.example
    ports: !override
      - 127.0.0.1:3102:3000

  atkuzu-daily:
    env_file: !override
      - env/atkuzu-daily.env.example

volumes:
  immich-postgres-local:
